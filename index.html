<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oyun — Chaos Run</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:18px;box-sizing:border-box;text-shadow:0 2px 4px #000}
#stats{font-size:15px;line-height:1.55;background:#0007;padding:8px 10px;border-radius:6px;width:max-content;min-width:210px}
.label{font-size:11px;opacity:.7;letter-spacing:.08em}
.bar{display:block;width:210px;height:7px;background:#222;border:1px solid #555;margin-top:3px;margin-bottom:5px;border-radius:4px;overflow:hidden}
.fill{display:block;height:100%;width:100%;transition:width .08s linear}
#hpbar{background:#d9534f}.stambar{background:#5aa9e6}
#status{position:absolute;top:18px;right:18px;text-align:right;background:#0007;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.6}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:bold;opacity:.9}
#message{position:absolute;left:50%;top:23%;transform:translateX(-50%);font-size:22px;font-weight:bold;text-align:center;white-space:nowrap;min-height:26px}
#slots{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);display:flex;gap:6px}
.slot{width:58px;height:52px;border:2px solid #666;background:#111d;text-align:center;font-size:11px;padding-top:4px;box-sizing:border-box;border-radius:5px}
.slot.selected{border-color:#fff;background:#333e;box-shadow:0 0 8px #fff5}
#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);opacity:.75;font-size:12px;white-space:nowrap;background:#0008;padding:5px 9px;border-radius:4px}
#objective{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.8;background:#0007;padding:6px 10px;border-radius:5px}
</style>
</head>
<body>
<div id="hud">
  <div id="stats">
    <div><span class="label">HEALTH</span> <span id="hp">100</span></div>
    <span class="bar"><span id="hpbar" class="fill"></span></span>
    <div><span class="label">STAMINA</span> <span id="stamina">100</span></div>
    <span class="bar"><span id="stambar" class="fill"></span></span>
    <div><span class="label">WEIGHT</span> <span id="weight">0.0</span> kg</div>
  </div>
  <div id="objective">HEDEF: SON NOKTAYA ULAŞ</div>
  <div id="status">RUN: <span id="run">1</span><br>CHAOS: <span id="chaos">LOW</span><br>WEATHER: <span id="weather">CLEAR</span></div>
  <div id="crosshair">+</div>
  <div id="message"></div>
  <div id="slots" class="slots"></div>
  <div id="help">WASD hareket · SHIFT sprint · SPACE zıpla · E al/kullan/taşı · Q çek · Sol tık ateş/vur · Sağ tık tırman</div>
</div>
<script type="module" src="./src/game.js"></script>
</body>
</html>
